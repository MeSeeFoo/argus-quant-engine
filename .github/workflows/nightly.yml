# Checks that are slow, flaky or change without any code change, so they do
# not block pull requests. Runs every night on main, and by hand on any branch.
# A failure opens (or updates) an issue labelled nightly-failure. See docs/ci.md.
name: Nightly

on:
  schedule:
    # 03:00 UTC. GitHub may start scheduled runs late when it is busy.
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-build:
    name: Build and test on Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build, test and check formatting, coverage and static analysis
        shell: pwsh
        run: .\mvnw.cmd --batch-mode --no-transfer-progress verify

  external-links:
    name: All links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check every link in the Markdown files
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: "'./**/*.md'"
        env:
          # Avoids GitHub's rate limit on links to github.com.
          GITHUB_TOKEN: ${{ github.token }}

  vulnerabilities:
    name: Known vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # New vulnerabilities are published every day, so this can fail without any code change.
      - name: Scan the dependencies (OSV-Scanner)
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --recursive
            ./

  report-failure:
    name: Report failure
    needs: [windows-build, external-links, vulnerabilities]
    # Only for the scheduled run: a manual run is watched by whoever started it.
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the nightly-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --label nightly-failure --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "Failed again: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label nightly-failure \
              --title "Nightly pipeline failed" \
              --body "The nightly pipeline failed: $RUN_URL. Close this issue once it is fixed; the next failure opens a new one."
          fi
