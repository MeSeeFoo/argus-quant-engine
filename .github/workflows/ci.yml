# Builds and tests every push to main and every pull request, and checks that
# the local Docker Compose stack starts and becomes healthy.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch or pull request cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Lets the test report action publish its check run with the results.
      checks: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build, test and check formatting
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Publish test report
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v6
        with:
          check_name: Test report
          report_paths: "**/target/surefire-reports/TEST-*.xml"
          include_passed: true
          detailed_summary: true
          require_tests: true

      - name: Upload test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/"
          retention-days: 7

  compose-smoke-test:
    name: Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra/docker
    steps:
      - uses: actions/checkout@v7

      - name: Create .env from the template
        run: cp .env.example .env

      - name: Start the stack and wait until every container is healthy
        run: docker compose up -d --wait --wait-timeout 300

      - name: Show container status
        if: ${{ always() }}
        run: docker compose ps --all

      - name: Show logs
        if: ${{ failure() }}
        run: docker compose logs --no-color

      - name: Tear down
        if: ${{ always() }}
        run: docker compose down -v
