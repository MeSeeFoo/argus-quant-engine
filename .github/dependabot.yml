# Weekly dependency updates. Minor and patch updates of each ecosystem are
# grouped in one pull request; major updates get their own. Commits follow
# Conventional Commits: build(deps) for Maven and Docker, ci(deps) for actions.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Wait a week before proposing a new release: compromised versions are usually caught by then.
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      maven-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Wait a week before proposing a new release: compromised versions are usually caught by then.
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker-compose
    directory: /infra/docker
    schedule:
      interval: weekly
      day: monday
    # Wait a week before proposing a new release: compromised versions are usually caught by then.
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      images-minor-and-patch:
        update-types: [minor, patch]
