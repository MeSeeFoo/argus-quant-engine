# Kafka topics for Argus: the single source of truth for their configuration.
# Read by create-topics.sh, which the kafka-init service runs every time it
# starts. Keep it in sync with the Contracts table in README.md.
#
# One topic per line, whitespace-separated:
#   name  partitions  cleanup.policy  retention.ms
# retention.ms is "-" for compacted topics: they keep the latest value of
# every key forever. 86400000 ms = 1 day.
#
# Apply changes with `docker compose restart kafka-init`. Partitions can only
# grow; shrinking a topic means deleting it first.
#
# Sizing, for a single local broker:
# - 3 partitions for keyed streams (key VENUE:SYMBOL or deployment id), so up
#   to three consumer instances share the load while each key stays in order.
# - 1 partition for low-volume topics where a global order is simpler.
# - Retention is short on purpose: Kafka is not the archive, QuestDB is.

# --- Market data (Phase 2) ----------------------------------------------------
# Every trade and every top-of-book update, never aggregated. Message `Trade` /
# `BestBidAsk`. model-engine -> data-archiver (QuestDB), bff (live charts).
# 3 days: enough for the archiver to catch up after an outage.
argus.market.trades.v1             3    delete    259200000
argus.market.quotes.v1             3    delete    259200000

# --- Model outputs (Phase 2 and 3) ----------------------------------------------
# Indicator values, conflated: the latest value per deployment and instrument,
# at most once per interval (ADR 0018). Message `IndicatorValue`, key: the
# deployment id. model-engine -> data-archiver, bff. Kept for 3 days.
argus.indicators.v1                3    delete    259200000

# Every alert raised by an AlertRule deployment. Message `Alert`, key: the
# deployment id. model-engine -> notification-dispatcher, data-archiver, bff.
argus.alerts.v1                    3    delete    604800000

# Alerts whose notification still failed after every retry (dead-letter
# topic), kept for 14 days so they can be inspected and replayed by hand.
# notification-dispatcher -> nobody automatically; read by an operator.
argus.alerts.dlq.v1                1    delete    1209600000

# Result of every notification: delivered, failed or suppressed (ADR 0020).
# notification-dispatcher -> data-archiver, bff.
argus.notification-deliveries.v1   3    delete    604800000

# --- State distributed to the services (ADR 0012) -----------------------------
# Compacted: Kafka keeps only the latest record per key, so each topic is the
# current state, not a history (the history lives in PostgreSQL). Services
# rebuild their state by reading them from the start. A record with a null
# value (tombstone) deletes the entity. Written by the bff after storing the
# change in PostgreSQL.
#
# Model definitions: code and ModelConfiguration, key: model id (ADR 0014).
# bff -> model-engine.
argus.models.v1                    1    compact   -
# Deployments: model version, instruments and parameters, key: deployment id.
# The partitions are the maximum number of model-engine instances: they share
# the deployments through a consumer group (ADR 0016). bff -> model-engine.
argus.model-deployments.v1         6    compact   -
# Instrument catalogue: venue, symbol, shard and status, key: VENUE:SYMBOL
# (ADR 0023). bff -> feed-gateway, feed-player, model-engine.
argus.instruments.v1               1    compact   -
# Notification channels configured by each user (ADR 0020).
# bff -> notification-dispatcher.
argus.notification-routes.v1       1    compact   -
# PANIC state, a single key (ADR 0019). bff -> model-engine.
argus.control.v1                   1    compact   -
# Connection status of every feed gateway, key: venue + shard + task (ADR 0022).
# feed-gateway -> bff.
argus.feed-status.v1               1    compact   -

# --- Audit (ADR 0019, 0026) ---------------------------------------------------
# Who did what: models created and deployed, parameters changed, PANIC
# requested and acknowledged, re-arm. bff, model-engine -> data-archiver.
# Kafka is not the archive: 30 days here, years in the regulatory archive.
argus.audit.v1                     1    delete    2592000000

# --- Feed gateway leases (ADR 0022) -------------------------------------------
# One single-partition topic per shard. The two tasks of the shard join a
# consumer group on it: the one that gets the partition is the active. No
# messages are written. Add one line per shard.
argus.feed-lease.shard-1.v1        1    delete    86400000
