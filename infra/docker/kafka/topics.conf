# Kafka topics for Argus: the single source of truth for their configuration.
# Read by create-topics.sh, which the kafka-init service runs every time it
# starts. Keep it in sync with the Contracts table in README.md.
#
# One topic per line, whitespace-separated:
#   name  partitions  cleanup.policy  retention.ms
# retention.ms is "-" for compacted topics: they keep the latest value of
# every key forever. 86400000 ms = 1 day.
#
# Apply changes with `docker compose restart kafka-init`. Partitions can only
# grow; shrinking a topic means deleting it first.
#
# Sizing, for a single local broker:
# - 3 partitions for keyed streams (key VENUE:SYMBOL), so up to three consumer
#   instances can share the load while each instrument stays in order.
# - 1 partition for low-volume topics where a global order is simpler.
# - Retention is short on purpose: Kafka is not the archive, QuestDB is.

# --- Market data (Phase 2) ----------------------------------------------------
# Every trade and every top-of-book update, never aggregated. Message `Trade` /
# `BestBidAsk`. signal-engine -> market-archiver (QuestDB), api (live charts).
# 3 days: enough for the archiver to catch up after an outage.
argus.market.trades.v1    3           delete          259200000
argus.market.quotes.v1    3           delete          259200000

# --- Signals (Phase 2) --------------------------------------------------------
# A rule's recommendation (long / short / flat), not an order. Message `Signal`.
# signal-engine -> market-archiver, api (UI). Low volume, kept for 7 days.
argus.signals.v1          3           delete          604800000

# --- Alerts (Phase 3) ---------------------------------------------------------
# A request to run an action (webhook, email) when a rule fires, or when the
# engine disables a failing rule. No Protobuf schema yet.
# signal-engine -> action-dispatcher, market-archiver, api.
argus.alerts.v1           3           delete          604800000

# Alerts whose action still failed after every retry (dead-letter topic), kept
# for 14 days so they can be inspected and replayed by hand.
# action-dispatcher -> nobody automatically; read by an operator or a tool.
argus.alerts.dlq.v1       1           delete          1209600000

# --- Rule distribution (Phase 3 and 4) ----------------------------------------
# Compacted: Kafka keeps only the latest record per key (the rule id), so the
# topic is the current state, not a history. On restart the signal engine
# rebuilds its rule set by reading it from the start. A record with a null
# value (tombstone) deletes a rule.
#
# Current definition of each Python rule (source + @rule metadata).
# api (after validating and storing it in PostgreSQL) -> signal-engine.
argus.rules.v1            1           compact         -
# Calibrated parameters for a rule, so it can be retuned without redeploying.
# quant-lab -> signal-engine.
argus.rule-params.v1      1           compact         -
