# Local infrastructure for Argus. Ports and credentials come from .env
# (copy .env.example). Start everything with: docker compose up -d --wait
name: argus

services:
  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    ports:
      - "${KAFKA_PORT:?set in .env}:9092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # INTERNAL for containers, EXTERNAL for clients on the host.
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Single broker: internal topics cannot be replicated.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null"]
      interval: 10s
      timeout: 15s
      retries: 10
      start_period: 20s

  questdb:
    image: questdb/questdb:10.0.1
    ports:
      - "${QUESTDB_HTTP_PORT:?set in .env}:9000" # web console + REST
      - "${QUESTDB_ILP_PORT:?set in .env}:9009" # InfluxDB Line Protocol (TCP)
      - "${QUESTDB_PG_PORT:?set in .env}:8812" # PostgreSQL wire protocol
    environment:
      QDB_PG_USER: ${QUESTDB_PG_USER:?set in .env}
      QDB_PG_PASSWORD: ${QUESTDB_PG_PASSWORD:?set in .env}
      QDB_TELEMETRY_ENABLED: "false"
    volumes:
      - questdb-data:/var/lib/questdb
    healthcheck:
      # Minimal health server, not published to the host.
      test: ["CMD", "curl", "-fs", "-o", "/dev/null", "http://localhost:9003/status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  postgres:
    image: postgres:18.6
    ports:
      - "${POSTGRES_PORT:?set in .env}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      # Read by init/01-apicurio.sh.
      APICURIO_DB: ${APICURIO_DB:?set in .env}
      APICURIO_DB_USER: ${APICURIO_DB_USER:?set in .env}
      APICURIO_DB_PASSWORD: ${APICURIO_DB_PASSWORD:?set in .env}
    volumes:
      # PostgreSQL 18+ keeps its data under a versioned subdirectory of this path.
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  apicurio:
    image: apicurio/apicurio-registry:3.3.3
    ports:
      - "${APICURIO_PORT:?set in .env}:8080"
    environment:
      APICURIO_STORAGE_KIND: sql
      APICURIO_STORAGE_SQL_KIND: postgresql
      APICURIO_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${APICURIO_DB}
      APICURIO_DATASOURCE_USERNAME: ${APICURIO_DB_USER}
      APICURIO_DATASOURCE_PASSWORD: ${APICURIO_DB_PASSWORD}
      # The web UI calls the API from the browser.
      QUARKUS_HTTP_CORS_ORIGINS: http://localhost:${APICURIO_UI_PORT:?set in .env}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Quarkus management interface (port 9000 inside the container).
      test: ["CMD", "curl", "-fs", "-o", "/dev/null", "http://localhost:9000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  apicurio-ui:
    image: apicurio/apicurio-registry-ui:3.3.3
    ports:
      - "${APICURIO_UI_PORT}:8080"
    environment:
      # Resolved by the browser, so it must be the address published on the host.
      REGISTRY_API_URL: http://localhost:${APICURIO_PORT}/apis/registry/v3
    depends_on:
      apicurio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "-o", "/dev/null", "http://localhost:8080/config.js"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  grafana:
    # All-in-one OpenTelemetry backend: Collector, Prometheus, Tempo, Loki, Pyroscope and Grafana.
    image: grafana/otel-lgtm:0.36.0
    ports:
      - "${GRAFANA_PORT:?set in .env}:3000"
      - "${OTLP_GRPC_PORT:?set in .env}:4317"
      - "${OTLP_HTTP_PORT:?set in .env}:4318"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set in .env}
    volumes:
      - grafana-data:/data
    healthcheck:
      # run-all.sh creates this file once every component is ready.
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  kafka-data:
  questdb-data:
  postgres-data:
  grafana-data:
