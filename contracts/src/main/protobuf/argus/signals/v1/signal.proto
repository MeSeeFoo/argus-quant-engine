// Topic argus.signals.v1: signals emitted by rules, for archiving, alerting and the UI.
//
// Mirrors the fast-path SBE Signal message: same fields, same field numbers (= SBE field ids),
// same decimal scale. Evolution rules: see contracts/README.md.
syntax = "proto3";

package argus.signals.v1;

option java_multiple_files = true;
option java_outer_classname = "SignalProto";
option java_package = "com.argus.contracts.proto.signals.v1";

// A rule's conclusion: be LONG, SHORT or FLAT on an instrument, with a strength.
// A recommendation, not an order. It points to the market event that triggered it.
//
// Kafka key: "VENUE:SYMBOL" (e.g. "BINANCE:BTCUSDT").
message Signal {
  // Monotonic per engine, starts at 1; consumers use it for gap detection.
  uint64 signal_id = 1;
  // Sequence of the market event that triggered the rule.
  uint64 trigger_sequence = 2;
  // Decimal64 mantissa: confidence in [0, 1], value = strength × 10⁻⁸. The direction is a separate field.
  int64 strength = 3;
  // Decimal64 mantissa: price the rule looked at (usually last trade or mid), value = reference_price × 10⁻⁸.
  int64 reference_price = 4;
  // Exchange timestamp of the triggering event, nanoseconds since the Unix epoch (UTC).
  int64 trigger_exchange_timestamp = 5;
  // Time the engine published the signal, nanoseconds since the Unix epoch (UTC).
  int64 emit_timestamp = 6;
  // Rule id.
  uint32 rule_id = 7;
  // Rule version that produced the signal.
  uint32 rule_version = 8;
  // Recommended position.
  Direction direction = 9;
  // Uppercase venue code, at most 12 US-ASCII characters (e.g. "BINANCE").
  string venue = 10;
  // Symbol as the venue names it, uppercase, no separator, at most 24 US-ASCII characters (e.g. "BTCUSDT").
  string symbol = 11;
}

// Position a signal recommends. LONG and SHORT match the SBE Direction enum; FLAT does not,
// because in Protobuf 0 is reserved for "not set" (SBE uses 0 for FLAT).
enum Direction {
  DIRECTION_UNSPECIFIED = 0;
  DIRECTION_LONG = 1;
  DIRECTION_SHORT = 2;
  DIRECTION_FLAT = 3;
}
