spring:
  application:
    name: argus-feed-gateway
  # The durable path's connection: Kafka and Apicurio of the local environment (infra/docker)
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Canonical Protobuf, with the schema in Apicurio (ADR 0008)
      value-serializer: io.apicurio.registry.serde.protobuf.ProtobufKafkaSerializer
      properties:
        # With Kafka down a send waits this long for the cluster, on the sender thread only: 60 s by
        # default. Shorter, so the sender gives up and moves on while the ring fills and drops
        max.block.ms: 5000
        apicurio.registry.url: ${APICURIO_REGISTRY_URL:http://localhost:8080/apis/registry/v3}
        # Locally the serializer registers the schemas on first use. Elsewhere it must be false:
        # schemas are registered before deploying (#6)
        apicurio.registry.auto-register: ${APICURIO_AUTO_REGISTER:true}

server:
  # 8080 is Apicurio in the local environment (infra/docker)
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health, metrics

argus:
  feed-gateway:
    # What the gateway does, whatever its adapters (ADR 0009)
    # The shard's instruments as VENUE:SYMBOL, until the instrument catalogue arrives (ADR 0023)
    instruments: BINANCE:BTCUSDT
    # A Heartbeat is published when nothing was published this long
    heartbeat-interval: 1s

    # Inbound adapter: Binance's SBE market data stream
    binance:
      uri: wss://stream-sbe.binance.com:9443
      # Read-only Ed25519 key, from the environment: never commit it
      api-key: ${BINANCE_API_KEY:}

    # Outbound adapter: the fast path over Aeron
    aeron:
      # Subscribers register with this control endpoint (dynamic multi-destination-cast, ADR 0021).
      # On AWS it becomes the task's address, found through Cloud Map.
      # fc=max: the fastest subscriber sets the pace, so a slow one loses data on its own side
      # instead of slowing the gateway down (ADR 0005).
      channel: aeron:udp?control=localhost:40456|control-mode=dynamic|fc=max
      # Shard 1 (ADR 0023)
      stream-id: 1001

    # Outbound adapter: the durable path over Kafka (ADR 0027), topics in infra/docker/kafka/topics.conf
    kafka:
      trade-topic-name: argus.market.trades.v1
      best-bid-ask-topic-name: argus.market.quotes.v1
      # Bytes of the ring buffer between the gateway agent and the Kafka sender, a power of two:
      # about ten thousand events before they are dropped
      buffer-capacity: 1048576
